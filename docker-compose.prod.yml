# ==============================================================================
# Docker Compose for Self-Hosted Production Environment
# ==============================================================================
# This file is intended for users who want to run the application on their own
# infrastructure. It uses pre-built images from the GitHub Container Registry.
#
# Usage:
# 1. Create a `.env.prod` file by copying `.env.example`.
# 2. Fill in the required environment variables in `.env.prod`.
# 3. Run `ENV_FILE=.env.prod docker compose -f docker-compose.prod.yml up -d`.
# ==============================================================================

services:
    #----------------------------------------------------------------
    # Application Services
    #----------------------------------------------------------------
    api:
        image: ghcr.io/elchapita43/codus-ai-api:${CODUS_VERSION:-latest}
        container_name: codus_api_prod
        restart: unless-stopped
        command: node dist/apps/api/main.js
        env_file:
            - ${ENV_FILE:-.env.prod}
        environment:
            - API_CLOUD_MODE=false
            - COMPONENT_TYPE=api
        ports:
            - '3331:3001'
        depends_on:
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
        networks:
            - codus-backend-services

    worker:
        image: ghcr.io/elchapita43/codus-ai-worker:${CODUS_VERSION:-latest}
        container_name: codus_worker_prod
        restart: unless-stopped
        command: node dist/apps/worker/main.js
        env_file:
            - ${ENV_FILE:-.env.prod}
        environment:
            - API_CLOUD_MODE=false
            - COMPONENT_TYPE=worker
            - WORKER_ROLE=code-review
        depends_on:
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
        networks:
            - codus-backend-services

    worker-analytics:
        image: ghcr.io/elchapita43/codus-ai-worker:${CODUS_VERSION:-latest}
        container_name: codus_analytics_worker_prod
        restart: unless-stopped
        command: node dist/apps/worker/main.js
        env_file:
            - ${ENV_FILE:-.env.prod}
        environment:
            - API_CLOUD_MODE=false
            - COMPONENT_TYPE=worker
            - WORKER_ROLE=analytics
        depends_on:
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
        networks:
            - codus-backend-services

    webhooks:
        image: ghcr.io/elchapita43/codus-ai-webhook:${CODUS_VERSION:-latest}
        container_name: codus_webhooks_prod
        restart: unless-stopped
        command: node dist/apps/webhooks/main.js
        env_file:
            - ${ENV_FILE:-.env.prod}
        environment:
            - API_CLOUD_MODE=false
            - COMPONENT_TYPE=webhook
        ports:
            - '3333:3332'
        depends_on:
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
        networks:
            - codus-backend-services

    #----------------------------------------------------------------
    # Web Frontend
    #----------------------------------------------------------------
    web:
        image: ghcr.io/elchapita43/codus-ai-web:${CODUS_VERSION:-latest}
        container_name: codus_web_prod
        restart: unless-stopped
        env_file:
            - ${ENV_FILE:-.env.prod}
        ports:
            - '3000:3000'
        networks:
            - codus-backend-services

    #----------------------------------------------------------------
    # Databases & Infrastructure
    #----------------------------------------------------------------
    db_postgres:
        image: docker.io/pgvector/pgvector:pg16
        container_name: codus_postgres_prod
        restart: unless-stopped
        env_file:
            - ${ENV_FILE:-.env.prod}
        volumes:
            - pgdata_prod:/var/lib/postgresql/data
        networks:
            - codus-backend-services
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${API_PG_DB_USERNAME} -d ${API_PG_DB_DATABASE}',
                ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s

    db_mongodb:
        image: docker.io/mongo:8
        container_name: codus_mongodb_prod
        restart: unless-stopped
        env_file:
            - ${ENV_FILE:-.env.prod}
        volumes:
            - mongodbdata_prod:/data/db
        networks:
            - codus-backend-services
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin | grep -q 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 20
            start_period: 20s

volumes:
    pgdata_prod:
    mongodbdata_prod:

networks:
    codus-backend-services:
        driver: bridge
